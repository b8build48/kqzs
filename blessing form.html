<script>
  const form = document.getElementById('myForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const name = formData.get('name');
    const classValue = formData.get('class');
    const age = formData.get('age');
    const parentPhoneNum = formData.get('parent phone num');
    const dateOfBirth = formData.get('date of birth');
    const stateOfOrign = formData.get('state of orign');
    const religion = formData.get('religion');

    const message = `Name: ${name}%0AClass: ${classValue}%0AAge: ${age}%0AParent Phone Num: ${parentPhoneNum}%0ADate of Birth: ${dateOfBirth}%0AState of Orign: ${stateOfOrign}%0AReligion: ${religion}`;
    const whatsappLink = `https://wa.me/+2348022508253?text=${message}`;
    window.open(whatsappLink, '_blank');
  });

<script>
const photoInput = document.getElementById('photo-input');
const uploadLabel = document.getElementById('upload-label');
const uploadedImage = document.getElementById('uploaded-image');

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    uploadedImage.src = reader.result;
    uploadedImage.style.display = 'block';
    uploadLabel.style.display = 'none';
  };
  reader.readAsDataURL(file);
});
</script>
